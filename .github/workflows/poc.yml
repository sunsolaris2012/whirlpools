name: Locked Delegate PoC
on: [push, workflow_dispatch]
jobs:
  poc:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.86.0
      - name: Install Solana
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
      - name: Build BPF
        run: cargo build-sbf --manifest-path programs/whirlpool/Cargo.toml 2>&1 | tail -10
      - name: Run PoC
        run: cargo test -p whirlpool --test real_attack -- --nocapture 2>&1 | tail -120
