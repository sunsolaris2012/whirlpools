name: Locked Delegate PoC
on: [push, workflow_dispatch]
jobs:
  poc:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.86.0
      - name: Install Solana
        run: |
          curl -sSfL -o solana.tar.bz2 https://github.com/anza-xyz/agave/releases/download/v2.2.1/solana-release-x86_64-unknown-linux-gnu.tar.bz2
          tar xjf solana.tar.bz2
          echo "$PWD/solana-release/bin" >> $GITHUB_PATH
      - name: Verify Solana
        run: |
          export PATH="$PWD/solana-release/bin:$PATH"
          solana --version
          which cargo-build-sbf
      - name: List test files
        run: |
          echo "=== files in programs/whirlpool/tests/ ==="
          ls -la programs/whirlpool/tests/ || echo "NO TESTS DIR"
          echo ""
          echo "=== real_attack.rs head ==="
          head -30 programs/whirlpool/tests/real_attack.rs || echo "NO FILE"
      - name: Build BPF
        run: |
          export PATH="$PWD/solana-release/bin:$PATH"
          cargo build-sbf --manifest-path programs/whirlpool/Cargo.toml
      - name: List BPF artifacts
        run: |
          ls -la target/deploy/ 2>/dev/null || echo "No deploy dir"
      - name: Run PoC
        run: |
          export PATH="$PWD/solana-release/bin:$PATH"
          cargo test -p whirlpool --test real_attack -- --nocapture --test-threads=1
