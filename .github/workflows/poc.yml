name: Locked Delegate PoC
on: [push, workflow_dispatch]
jobs:
  poc:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.86.0
      - name: Install Solana
        run: |
          curl -sSfL -o solana.tar.bz2 https://github.com/anza-xyz/agave/releases/download/v2.2.1/solana-release-x86_64-unknown-linux-gnu.tar.bz2
          tar xjf solana.tar.bz2
          echo "$PWD/solana-release/bin" >> $GITHUB_PATH
      - name: Pin incompatible solana deps
        run: |
          cargo update -p solana-account-info --precise 2.3.0 || true
          cargo update -p solana-instructions-sysvar --precise 2.2.2 || true
          cargo update -p solana-program --precise 2.2.1 || true
          cargo update -p solana-account-info --precise 2.3.0 || true
      - name: Build BPF
        run: |
          export PATH="$PWD/solana-release/bin:$PATH"
          cargo build-sbf --manifest-path programs/whirlpool/Cargo.toml
      - name: Run PoC
        run: |
          export PATH="$PWD/solana-release/bin:$PATH"
          cargo test -p whirlpool --test real_attack -- --nocapture --test-threads=1
